server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/keystone}
    username: ${DB_USERNAME:keystone}
    password: ${DB_PASSWORD:keystone}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-a-long-random-value-123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
